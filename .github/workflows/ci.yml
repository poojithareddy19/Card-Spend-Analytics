name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,serve,docstore]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      # Generator, contracts and lake landing. No dbt, no stores, under a minute.
      - run: pytest tests -q -m "not slow and not bench"

  full-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CSA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/card_spend_test
      CSA_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,serve,docstore]"
      # Everything: dbt build with its 78 tests, the multi-store load, and the plan-shape gates
      # that stop a dropped index or a broken partition key reaching main.
      - run: pytest tests -q -m "not bench" --cov --cov-report=term-missing
