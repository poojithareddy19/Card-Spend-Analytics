[project]
name = "card-spend-analytics"
version = "0.1.0"
description = "Card spend analytics: domain model, multi-store query benchmarks and a reporting layer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "fastavro>=1.9",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    # `card-spend build` shells out to the dbt CLI, so it is a hard dependency of the pipeline
    # rather than an extra: `make all` does not complete without it.
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
serve = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
# The key-value document store. Optional because the rest of the pipeline runs without it, but it
# has to be installable, or the store reports itself unreachable and the benchmark quietly omits it.
docstore = ["redis>=5.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
card-spend = "card_spend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_spend"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.pycodestyle]
# Reference tables and record literals read better on one line than wrapped.
max-line-length = 140

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
# spec.py is column-aligned reference data: the MCC table, the currency table and the defect
# catalogue are meant to be read as tables, and the formatter would collapse the alignment.
exclude = ["src/card_spend/generate/spec.py"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["card_spend"]

[[tool.mypy.overrides]]
module = ["fastavro.*", "duckdb.*", "pyarrow.*", "redis.*", "psycopg.*", "yaml.*", "numpy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: runs dbt or a full pipeline; minutes rather than seconds",
    "bench: runs against the 50M row bench dataset, excluded from the default run",
]

[tool.coverage.run]
source = ["card_spend"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
